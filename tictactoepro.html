<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe - Timer & Red Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-grad-1: #0f2027;
            --bg-grad-2: #203a43;
            --bg-grad-3: #2c5364;
            --p1-color: #ff073a;
            --p2-color: #00e5ff;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --timer-color: #2ecc71;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: clamp(1.5rem, 5vw, 2rem);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            text-align: center;
        }

        /* Modal Overlay */
        #setupModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }

        .modal-content {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 30px; border-radius: 15px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 90%; max-width: 400px;
        }

        .modal-content h2 { margin-bottom: 20px; font-size: 1.5rem; }
        .input-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .input-box { display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .input-box span { font-size: 0.9rem; color: #ccc; }
        
        .input-box input {
            width: 70px; height: 70px; font-size: 2.5rem; text-align: center;
            font-weight: bold; text-transform: uppercase; background: rgba(255,255,255,0.1);
            color: #fff; border: 2px solid; border-radius: 10px; outline: none; transition: all 0.3s;
        }
        
        #p1Input { border-color: var(--p1-color); }
        #p1Input:focus { box-shadow: 0 0 20px var(--p1-color); }
        #p2Input { border-color: var(--p2-color); }
        #p2Input:focus { box-shadow: 0 0 20px var(--p2-color); }
        #modalError { color: #ff4757; font-size: 0.9rem; margin-bottom: 15px; min-height: 20px; }

        /* Papan Skor & Kartu Merah */
        #scoreboard {
            display: flex; gap: clamp(10px, 4vw, 20px); margin-bottom: 15px;
            width: 100%; max-width: 400px; justify-content: center;
        }
        
        .score-box {
            padding: 10px; background: var(--panel-bg); border-radius: 12px;
            border: 1px solid var(--border-color); flex: 1; text-align: center;
            position: relative;
        }

        .score-name { font-size: clamp(1.2rem, 4vw, 1.5rem); font-weight: bold; }
        .red-cards-container { font-size: 1rem; margin-top: 5px; height: 20px; letter-spacing: 2px; }
        
        .score-p1 { color: var(--p1-color); border-bottom: 4px solid var(--p1-color); }
        .score-p2 { color: var(--p2-color); border-bottom: 4px solid var(--p2-color); }

        /* Timer UI */
        #timerContainer {
            width: 100%; max-width: 400px; background: rgba(0,0,0,0.3);
            border-radius: 10px; height: 15px; margin-bottom: 15px;
            position: relative; overflow: hidden; border: 1px solid var(--border-color);
        }
        #timerBar {
            height: 100%; width: 100%; background: var(--timer-color);
            transition: width 1s linear, background-color 0.3s;
        }
        #timerText {
            position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
            font-size: 0.8rem; font-weight: bold; color: #fff;
        }

        #status {
            font-size: clamp(0.9rem, 3.5vw, 1.1rem); margin-bottom: 15px;
            padding: 10px 20px; background: var(--panel-bg); border-radius: 30px;
            border: 1px solid var(--border-color); text-align: center; width: 100%; max-width: 450px;
        }

        /* Papan Grid */
        #board {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            gap: clamp(6px, 2vw, 12px); padding: clamp(10px, 3vw, 20px);
            background: rgba(0, 0, 0, 0.2); border-radius: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
        }

        .cell {
            background-color: rgba(255, 255, 255, 0.03); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(2.5rem, 10vw, 4rem); font-weight: bold; cursor: pointer;
            transition: all 0.2s; position: relative;
        }

        .cell:hover { background-color: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
        .cell span { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }

        .cell.p1 { color: var(--p1-color); text-shadow: 0 0 15px var(--p1-color); }
        .cell.p2 { color: var(--p2-color); text-shadow: 0 0 15px var(--p2-color); }
        .cell.selected { background-color: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.5); transform: scale(0.95); }
        .cell.valid-move { background-color: rgba(255, 255, 255, 0.05); border: 2px dashed rgba(255, 255, 255, 0.4); }
        .cell.win { animation: winPulse 1s infinite alternate; }
        @keyframes winPulse { 0% { box-shadow: inset 0 0 10px #fff; transform: scale(1); } 100% { box-shadow: inset 0 0 30px #fff; transform: scale(1.05); z-index: 10; } }
        .cell.draw { background-color: #f39c12 !important; color: white !important; }

        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; width: 100%; max-width: 450px; }
        button {
            flex: 1; min-width: 140px; padding: 12px 15px; font-size: clamp(0.9rem, 3vw, 1rem);
            font-weight: 600; background: rgba(255, 255, 255, 0.1); color: white;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; cursor: pointer; transition: all 0.3s;
        }
        button:hover { background: rgba(255, 255, 255, 0.2); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        button:active { transform: translateY(1px); }

        .instructions {
            margin-top: 20px; width: 100%; max-width: 450px; text-align: center;
            font-size: clamp(0.75rem, 2.5vw, 0.85rem); color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; line-height: 1.4;
        }
        .highlight { color: #ff4757; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Modal Pemilihan Bidak -->
    <div id="setupModal">
        <div class="modal-content">
            <h2>Pilih Bidak Kalian</h2>
            <div class="input-group">
                <div class="input-box">
                    <span>Pemain 1</span>
                    <input type="text" id="p1Input" maxlength="1" placeholder="X" oninput="validateInput(this)">
                </div>
                <div class="input-box">
                    <span>Pemain 2</span>
                    <input type="text" id="p2Input" maxlength="1" placeholder="O" oninput="validateInput(this)">
                </div>
            </div>
            <div id="modalError"></div>
            <button onclick="applySetup()">Mulai Main</button>
        </div>
    </div>

    <h1>Neon Tapatan</h1>
    
    <div id="scoreboard">
        <div class="score-box score-p1">
            <div class="score-name"><span id="nameP1">P1</span> : <span id="scoreP1">0</span></div>
            <div class="red-cards-container" id="rcP1"></div>
        </div>
        <div class="score-box score-p2">
            <div class="score-name"><span id="nameP2">P2</span> : <span id="scoreP2">0</span></div>
            <div class="red-cards-container" id="rcP2"></div>
        </div>
    </div>

    <!-- Timer UI -->
    <div id="timerContainer">
        <div id="timerBar"></div>
        <div id="timerText">15s</div>
    </div>

    <div id="status">Pilih bidak untuk memulai...</div>
    <div id="board"></div>

    <div class="btn-group">
        <button onclick="startNewRound()">Ronde Baru</button>
        <button onclick="triggerResetScore()">Ganti Bidak & Reset</button>
    </div>

    <div class="instructions">
        Fase 1: Taruh bidak. Fase 2: Pindah bidak.<br>
        ⏱️ <span class="highlight">15 Detik per giliran! Lewat = Kartu Merah 🟥.</span><br>
        🟥 <span class="highlight">Dapat 3 Kartu Merah = Kalah.</span><br>
        🤝 Lebih dari 40 perpindahan bidak = SERI.
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const modal = document.getElementById('setupModal');
        const modalError = document.getElementById('modalError');
        const timerBar = document.getElementById('timerBar');
        const timerText = document.getElementById('timerText');
        
        let p1Char = '', p2Char = '';
        let scores = { p1: 0, p2: 0 };
        
        let board = [];
        let currentPlayer = 'p1'; 
        let piecesPlaced = { p1: 0, p2: 0 };
        let redCards = { p1: 0, p2: 0 };
        
        let selectedIndex = null;
        let gameActive = false;
        let phase = 'place'; 
        let phase2MovesCount = 0;
        const MAX_PHASE2_MOVES = 40; // Batas perpindahan untuk Seri

        // Timer Vars
        const MAX_TIME = 15;
        let timeLeft = MAX_TIME;
        let timerInterval = null;

        const validMovesMap = {
            0: [1, 3, 4], 1: [0, 2, 3, 4, 5], 2: [1, 4, 5],
            3: [0, 1, 4, 6, 7], 4: [0, 1, 2, 3, 5, 6, 7, 8], 5: [1, 2, 4, 7, 8],
            6: [3, 4, 7], 7: [3, 4, 5, 6, 8], 8: [4, 5, 7]
        };
        const winConditions = [
            [0,1,2], [3,4,5], [6,7,8], 
            [0,3,6], [1,4,7], [2,5,8], 
            [0,4,8], [2,4,6]             
        ];

        function validateInput(input) {
            input.value = input.value.toUpperCase().replace(/[^A-Z]/g, '');
            modalError.innerText = "";
        }

        function applySetup() {
            let val1 = document.getElementById('p1Input').value;
            let val2 = document.getElementById('p2Input').value;
            if (val1 === '' || val2 === '') { modalError.innerText = "Keduanya harus memilih huruf!"; return; }
            if (val1 === val2) { modalError.innerText = "Huruf tidak boleh sama!"; return; }

            p1Char = val1; p2Char = val2;
            document.getElementById('nameP1').innerText = p1Char;
            document.getElementById('nameP2').innerText = p2Char;
            
            modal.style.display = 'none';
            scores = { p1: 0, p2: 0 };
            updateScoreUI();
            startNewRound();
        }

        function triggerResetScore() {
            document.getElementById('p1Input').value = '';
            document.getElementById('p2Input').value = '';
            modalError.innerText = '';
            modal.style.display = 'flex';
            stopTimer();
            gameActive = false;
        }

        function startNewRound() {
            if(!p1Char || !p2Char) return; 
            board = Array(9).fill(null);
            currentPlayer = 'p1'; 
            piecesPlaced = { p1: 0, p2: 0 };
            redCards = { p1: 0, p2: 0 };
            phase2MovesCount = 0;
            selectedIndex = null;
            gameActive = true;
            phase = 'place';
            
            updateRedCardUI();
            updateStatus();
            renderBoard();
            startTimer();
        }

        // --- SISTEM TIMER & KARTU MERAH ---
        function startTimer() {
            stopTimer();
            if (!gameActive) return;
            
            timeLeft = MAX_TIME;
            updateTimerVisual();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerVisual();
                
                if (timeLeft <= 0) {
                    handleTimeout();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerBar.style.width = '100%';
            timerBar.style.backgroundColor = 'var(--timer-color)';
            timerText.innerText = `15s`;
        }

        function updateTimerVisual() {
            let percentage = (timeLeft / MAX_TIME) * 100;
            timerBar.style.width = `${percentage}%`;
            timerText.innerText = `${timeLeft}s`;

            if (timeLeft <= 5) timerBar.style.backgroundColor = '#e74c3c'; // Merah
            else if (timeLeft <= 10) timerBar.style.backgroundColor = '#f1c40f'; // Kuning
            else timerBar.style.backgroundColor = 'var(--timer-color)'; // Hijau
        }

        function handleTimeout() {
            stopTimer();
            redCards[currentPlayer]++;
            updateRedCardUI();

            if (redCards[currentPlayer] >= 3) {
                // Diskuilifikasi
                let winner = currentPlayer === 'p1' ? 'p2' : 'p1';
                processWin(winner, null, false, true); // true = menang karena kartu merah
            } else {
                // Beri peringatan dan reset waktu untuk pemain yang sama
                const charPlayer = currentPlayer === 'p1' ? p1Char : p2Char;
                statusElement.innerHTML = `⚠️ <span style="color:#ff4757">WAKTU HABIS!</span> ${charPlayer} kena Kartu Merah! Cepat melangkah!`;
                setTimeout(() => { if(gameActive) updateStatus(); }, 2000);
                startTimer(); // Ulangi timer untuk pemain ini
            }
        }

        function updateRedCardUI() {
            document.getElementById('rcP1').innerText = '🟥'.repeat(redCards.p1);
            document.getElementById('rcP2').innerText = '🟥'.repeat(redCards.p2);
        }
        // ---------------------------------

        function updateScoreUI() {
            document.getElementById('scoreP1').innerText = scores.p1;
            document.getElementById('scoreP2').innerText = scores.p2;
        }

        function handleCellClick(index) {
            if (!gameActive) return;

            if (phase === 'place') {
                if (board[index] !== null) return; 

                board[index] = currentPlayer;
                piecesPlaced[currentPlayer]++;
                
                if (checkWinLine()) return;

                if (piecesPlaced.p1 === 3 && piecesPlaced.p2 === 3) {
                    phase = 'move';
                }

                switchPlayer();
                if (phase === 'move') checkTrap(); 
                
                renderBoard();
            } 
            else if (phase === 'move') {
                if (board[index] === currentPlayer) {
                    selectedIndex = (selectedIndex === index) ? null : index;
                    renderBoard(); 
                    return;
                }

                if (selectedIndex !== null && board[index] === null) {
                    if (validMovesMap[selectedIndex].includes(index)) {
                        board[index] = currentPlayer;
                        board[selectedIndex] = null;
                        selectedIndex = null; 
                        
                        if (checkWinLine()) return;
                        
                        // Cek Draw karena terlalu lama
                        phase2MovesCount++;
                        if (phase2MovesCount >= MAX_PHASE2_MOVES) {
                            processDraw();
                            return;
                        }

                        switchPlayer();
                        checkTrap();
                        
                        renderBoard();
                    }
                }
            }
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 'p1' ? 'p2' : 'p1';
            updateStatus();
            startTimer(); // Reset timer tiap ganti giliran
        }

        function checkWinLine() {
            for (let condition of winConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    processWin(board[a], condition);
                    return true;
                }
            }
            return false;
        }

        function checkTrap() {
            if (phase !== 'move' || !gameActive) return false;
            
            let canMove = false;
            for (let i = 0; i < board.length; i++) {
                if (board[i] === currentPlayer) {
                    let adjacents = validMovesMap[i];
                    for (let adj of adjacents) {
                        if (board[adj] === null) { canMove = true; break; }
                    }
                }
                if (canMove) break;
            }

            if (!canMove) {
                let winner = currentPlayer === 'p1' ? 'p2' : 'p1';
                processWin(winner, null, true);
                return true;
            }
            return false;
        }

        function processWin(winnerId, winningCells = null, byTrap = false, byRedCard = false) {
            gameActive = false;
            stopTimer();
            scores[winnerId]++;
            updateScoreUI();

            const charWinner = winnerId === 'p1' ? p1Char : p2Char;
            const colorWinner = winnerId === 'p1' ? 'var(--p1-color)' : 'var(--p2-color)';
            
            if (byRedCard) {
                statusElement.innerHTML = `🟥 Bidak ${charWinner} Menang! Lawan Didiskualifikasi! 🟥`;
            } else if (byTrap) {
                statusElement.innerHTML = `🔥 Bidak ${charWinner} Menang! Lawan Terjebak! 🔥`;
            } else {
                statusElement.innerHTML = `🏆 Bidak ${charWinner} Menang! 🏆`;
            }
            
            statusElement.style.color = colorWinner;
            statusElement.style.textShadow = `0 0 10px ${colorWinner}`;
            
            renderBoard(); 
            if (winningCells) {
                setTimeout(() => highlightWin(winningCells), 50); 
            }
        }

        function processDraw() {
            gameActive = false;
            stopTimer();
            statusElement.innerHTML = `🤝 PERMAINAN SERI! 🤝`;
            statusElement.style.color = "#f39c12";
            statusElement.style.textShadow = `0 0 10px #f39c12`;
            
            // Highlight seluruh papan
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => cell.classList.add('draw'));
        }

        function updateStatus() {
            if (!gameActive) return;
            statusElement.style.color = "#fff";
            statusElement.style.textShadow = "none";
            
            const charPlayer = currentPlayer === 'p1' ? p1Char : p2Char;
            const colorPlayer = currentPlayer === 'p1' ? 'var(--p1-color)' : 'var(--p2-color)';
            const playerSpan = `<span style="color:${colorPlayer}; text-shadow:0 0 10px ${colorPlayer}; font-weight:bold;">${charPlayer}</span>`;
            
            if (phase === 'place') {
                statusElement.innerHTML = `Giliran ${playerSpan} (Bidak: ${piecesPlaced[currentPlayer]}/3)`;
            } else {
                statusElement.innerHTML = `Giliran ${playerSpan} (Sisa langkah Seri: ${MAX_PHASE2_MOVES - phase2MovesCount})`;
            }
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            board.forEach((value, index) => {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                if (value) {
                    const charDisplay = value === 'p1' ? p1Char : p2Char;
                    cell.innerHTML = `<span>${charDisplay}</span>`;
                    cell.classList.add(value); 
                }

                if (index === selectedIndex) cell.classList.add('selected');

                if (phase === 'move' && selectedIndex !== null && board[index] === null) {
                    if (validMovesMap[selectedIndex].includes(index)) {
                        cell.classList.add('valid-move');
                    }
                }

                cell.addEventListener('click', () => handleCellClick(index));
                boardElement.appendChild(cell);
            });
        }

        function highlightWin(winningCells) {
            const cells = document.querySelectorAll('.cell');
            winningCells.forEach(index => {
                if(cells[index]) cells[index].classList.add('win');
            });
        }
    </script>
</body>
</html>
